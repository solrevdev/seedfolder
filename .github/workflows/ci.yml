# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

permissions:
    contents: write

on:
    push:
        branches:
            - master
            - release/*
        paths-ignore:
          - '**/*.md'
          - '**/*.gitignore'
          - '**/*.gitattributes'
    pull_request:
        branches:
            - master
            - release/*
        paths-ignore:
            - '**/*.md'
            - '**/*.gitignore'
            - '**/*.gitattributes'
jobs:
    build:
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && contains(toJson(github.event.commits), '***NO_CI***') == false && contains(toJson(github.event.commits), '[ci skip]') == false && contains(toJson(github.event.commits), '[skip ci]') == false)
        runs-on: ubuntu-latest
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
          DOTNET_NOLOGO: true
          DOTNET_GENERATE_ASPNET_CERTIFICATE: false
          DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: false
          DOTNET_MULTILEVEL_LOOKUP: 0

        steps:
            - name: checkout code
              uses: actions/checkout@v5

            - name: setup .net core sdk
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: |
                    8.0.x
                    9.0.x
                    10.0.x

            - name: dotnet build
              run: dotnet build solrevdev.seedfolder.sln --configuration Release

            - name: run integration tests
              run: ./tests/integration-test.sh

            - name: dotnet pack
              run: dotnet pack solrevdev.seedfolder.sln -c Release --no-build --include-source --include-symbols

            - name: Publish NuGet
              if: github.event_name == 'push' && github.ref == 'refs/heads/master'
              env:
                NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
              run: |
                version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/solrevdev.seedfolder.csproj)
                package="src/nupkg/solrevdev.seedfolder.${version}.nupkg"
                tag="v${version}"

                if [[ -z "$version" || ! -f "$package" ]]; then
                  echo "Unable to find the package version or package file." >&2
                  exit 1
                fi

                dotnet nuget push "$package" \
                  --api-key "$NUGET_API_KEY" \
                  --source https://api.nuget.org/v3/index.json \
                  --skip-duplicate

                if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
                  echo "Tag ${tag} already exists; no tag update needed."
                else
                  git tag "$tag"
                  git push origin "$tag"
                fi
